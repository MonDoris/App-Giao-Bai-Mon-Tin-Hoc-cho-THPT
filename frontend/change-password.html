<!doctype html>
<html lang="vi" data-guard>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f4f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1424" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Đổi mật khẩu tài khoản DK Edu của bạn.">
  <title>Đổi mật khẩu – DK Edu</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/be-vietnam-pro-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/be-vietnam-pro-latin-700-normal.woff2">
  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <noscript><style>html[data-guard] body{visibility:visible}</style></noscript>
</head>
<body data-shell>
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <aside class="app-sidebar" id="site-menu"></aside>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container container--narrow">
    <h1 class="page-title">Đổi mật khẩu</h1>
    <div id="must-change" aria-live="polite"></div>
    <div class="card narrow-form">
      <div id="form-alert" role="alert"></div>
      <form id="password-form" novalidate>
        <div class="form-field">
          <label for="current">Mật khẩu hiện tại</label>
          <input class="input" id="current" type="password" autocomplete="current-password" maxlength="128" aria-describedby="current-error">
          <p class="field-error" id="current-error" role="alert" hidden></p>
        </div>
        <div class="form-field">
          <label for="new">Mật khẩu mới</label>
          <p class="hint" id="new-hint">Mật khẩu dài 8–128 ký tự, có ít nhất 1 chữ cái và 1 chữ số, không trùng tên đăng nhập.</p>
          <input class="input" id="new" type="password" autocomplete="new-password" maxlength="128" aria-describedby="new-hint new-error strength-note">
          <p class="field-error" id="new-error" role="alert" hidden></p>
        </div>
        <div class="strength" id="strength" data-level="">
          <span class="strength__title" id="strength-title">Độ mạnh mật khẩu</span>
          <div class="strength__bars" aria-hidden="true"><span class="strength__seg"></span><span class="strength__seg"></span><span class="strength__seg"></span><span class="strength__seg"></span></div>
          <p class="strength__label" id="strength-label" role="status" aria-live="polite"></p>
          <p class="hint strength__note" id="strength-note">Chỉ là gợi ý, bạn vẫn đổi được mật khẩu nếu đạt yêu cầu ở trên.</p>
        </div>
        <div class="form-field">
          <label for="again">Nhập lại mật khẩu mới</label>
          <input class="input" id="again" type="password" autocomplete="new-password" maxlength="128" aria-describedby="again-error">
          <p class="field-error" id="again-error" role="alert" hidden></p>
        </div>
        <button class="btn btn--primary" id="btn-save" type="submit">Đổi mật khẩu</button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/pages/change-password.js"></script>
</body>
</html>
